name: Extract project zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and move project to repo root
        run: |
          unzip -o ayna-app-code-v5-github.zip
          ls ayna-app
          shopt -s dotglob
          cp -a ayna-app/. .
          rm -rf ayna-app ayna-app-code-v5-github.zip .github/workflows/extract-zip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add Ayna project files from v5 zip" || echo "nothing to commit"
          git push
