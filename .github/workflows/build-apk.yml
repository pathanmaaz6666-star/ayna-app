name: Build Ayna APK

# Builds the debug APK in GitHub's cloud on every push to main,
# or manually from the Actions tab ("Run workflow").
# No laptop build needed — download the APK from the run's artifacts.
# Note: this project has no gradlew launcher, so Gradle is installed
# directly with gradle/actions/setup-gradle (8.5, matching the wrapper).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayna-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
