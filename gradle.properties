org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Fix for "Could not connect to Kotlin compile daemon" on Maaz's laptop:
# run the Kotlin compiler in-process instead of via a separate daemon.
kotlin.compiler.execution.strategy=in-process
# Build speed (v4): parallel tasks, local build cache, on-demand configuration,
# incremental Kotlin compilation. Safe flags only — no dependency versions changed,
# so Maaz's existing Gradle cache is reused and nothing re-downloads.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
kotlin.incremental=true
# Ayna licence/admin server base URL. Replace when Maaz deploys the server.
aynaApiUrl=https://api.ayna.app
